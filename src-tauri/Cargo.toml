[package]
name = "sunet"
version = "0.0.1"
description = "速网 SuNet · 网络配置切换器"
authors = ["SuNet"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "SuNet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
encoding_rs = "0.8"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "native-tls",
  "gzip",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# 平台专属依赖：只编译对应平台的那一份
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
# geteuid / chown / chmod / if_nametoindex / LOCAL_PEERCRED
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
